name = "frontendnew"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist-web"
# The SPA fallback: serves index.html for any path that isn't a built asset, so
# hitting /dashboard or /login directly reaches React Navigation instead of 404ing
# at the edge. This is the whole mechanism — do NOT also ship a Pages-style
# _redirects file with `/* /index.html 200`: the Workers API rejects that rule
# outright as an infinite loop and fails the deploy.
not_found_handling = "single-page-application"
